name: Canary

# The coverage ledger needs jq and gawk, which the image lacks.

on:
  schedule:
    # 06:27 JST, after gaato/moonbit-docker rebuilds the latest and nightly images.
    - cron: "27 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    uses: gaato/.github/.github/workflows/moonbit-canary.yml@main
    with:
      gates: scripts/gates.sh && scripts/coverage_report.sh
      setup: apt-get update && apt-get install -y --no-install-recommends jq gawk
